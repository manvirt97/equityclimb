name: EquityClimb quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    name: JavaScript syntax and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: npm test
      - name: JavaScript syntax checks
        run: npm run syntax
